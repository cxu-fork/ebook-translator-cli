name: build-linux

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - ".github/workflows/build-linux.yml"

permissions:
  contents: read

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - arch: armhf
            runner: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            cross: true
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install armhf cross compiler
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf
          echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc' >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        if: matrix.cross != true
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ebook-translator" "dist/ebook-translator-linux-${{ matrix.arch }}"
          chmod +x "dist/ebook-translator-linux-${{ matrix.arch }}"
          sha256sum "dist/ebook-translator-linux-${{ matrix.arch }}" > "dist/ebook-translator-linux-${{ matrix.arch }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebook-translator-linux-${{ matrix.arch }}
          path: |
            dist/ebook-translator-linux-${{ matrix.arch }}
            dist/ebook-translator-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
