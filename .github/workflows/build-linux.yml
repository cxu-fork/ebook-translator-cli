name: build-linux

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-linux.yml"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - arch: armhf
            runner: ubuntu-24.04
            target: armv7-unknown-linux-gnueabihf
            cross: true
          - arch: armhf-static
            runner: ubuntu-24.04
            target: armv7-unknown-linux-musleabihf
            musl: true
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install armhf glibc cross compiler
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf
          echo 'CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc' >> $GITHUB_ENV

      - name: Install Zig
        if: matrix.musl == true
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.musl == true
        run: cargo install cargo-zigbuild --locked

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        if: matrix.cross != true && matrix.musl != true
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        if: matrix.musl != true
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build static release binary
        if: matrix.musl == true
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Verify static binary
        if: matrix.musl == true
        shell: bash
        run: |
          file "target/${{ matrix.target }}/release/ebook-translator"
          if ldd "target/${{ matrix.target }}/release/ebook-translator" 2>&1 | grep -qvE 'not a dynamic executable|statically linked'; then
            echo 'Binary is not fully static'
            exit 1
          fi
          if readelf --version-info "target/${{ matrix.target }}/release/ebook-translator" 2>/dev/null | grep -q 'GLIBC_'; then
            echo 'Binary still has GLIBC symbol requirements'
            exit 1
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ebook-translator" "dist/ebook-translator-linux-${{ matrix.arch }}"
          chmod +x "dist/ebook-translator-linux-${{ matrix.arch }}"
          sha256sum "dist/ebook-translator-linux-${{ matrix.arch }}" > "dist/ebook-translator-linux-${{ matrix.arch }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ebook-translator-linux-${{ matrix.arch }}
          path: |
            dist/ebook-translator-linux-${{ matrix.arch }}
            dist/ebook-translator-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
